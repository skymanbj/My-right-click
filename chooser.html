<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入到 Joplin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 14px;
            display: flex;
            align-items: stretch;
        }

        .container {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 16px;
            padding: 18px;
            width: 100%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 17px;
            color: #1a1a1a;
            text-align: center;
        }

        .subtitle {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin: 4px 0 12px;
        }

        .note-preview {
            font-size: 12px;
            color: #334155;
            background: #f1f5f9;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 10px;
            max-height: 48px;
            overflow: hidden;
            line-height: 1.4;
        }

        .search {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            background: #f8fafc;
            margin-bottom: 10px;
        }

        .search:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.18);
        }

        .folder-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 4px;
            min-height: 160px;
        }

        .folder-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #334155;
            cursor: pointer;
        }

        .folder-item:hover {
            background: #f1f5f9;
        }

        .folder-item.selected {
            background: #eef2ff;
            color: #4338ca;
            font-weight: 600;
        }

        .folder-item input {
            accent-color: #667eea;
        }

        .empty {
            padding: 24px 12px;
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
        }

        .btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 12px;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .status {
            margin-top: 10px;
            padding: 9px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .status.success {
            display: block;
            background: #dcfce7;
            color: #16a34a;
        }

        .status.error {
            display: block;
            background: #fee2e2;
            color: #dc2626;
        }

        .status.info {
            display: block;
            background: #e0f2fe;
            color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>导入到 Joplin</h1>
        <p class="subtitle">选择要导入的目标笔记本</p>

        <div class="note-preview" id="notePreview">正在读取待导入内容…</div>

        <input type="text" class="search" id="searchBox" placeholder="搜索笔记本…">

        <div class="folder-list" id="folderList">
            <div class="empty">正在读取笔记本列表…</div>
        </div>

        <button class="btn btn-primary" id="importBtn">导入到所选笔记本</button>
        <button class="btn btn-secondary" id="cancelBtn">取消</button>

        <div class="status" id="status"></div>
    </div>

    <script src="chooser.js"></script>
</body>
</html>
