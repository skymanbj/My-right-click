<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的右键 - 设置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 24px;
            color: #1a1a1a;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            text-align: center;
            margin-bottom: 32px;
        }

        .setting-group {
            margin-bottom: 24px;
        }

        .setting-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 8px;
        }

        .setting-group .description {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .setting-group input[type="text"],
        .setting-group input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        .setting-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .toggle {
            position: relative;
            width: 48px;
            height: 26px;
            background: #cbd5e1;
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .toggle.active {
            background: #667eea;
        }

        .toggle::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s ease;
        }

        .toggle.active::after {
            transform: translateX(22px);
        }

        .toggle-label {
            font-size: 14px;
            color: #34495e;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #64748b;
            margin-top: 12px;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .status {
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .status.success {
            display: block;
            background: #dcfce7;
            color: #16a34a;
        }

        .status.error {
            display: block;
            background: #fee2e2;
            color: #dc2626;
        }

        .version {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的右键设置</h1>
        <p class="subtitle">配置你的个性化选项</p>

        <div class="setting-group">
            <label for="joplinToken">📝 Joplin API Token</label>
            <p class="description">用于将笔记同步到 Joplin。你可以在 Joplin 的"工具 > 选项 > 高级"中找到此 Token。</p>
            <input type="password" id="joplinToken" placeholder="请输入你的 Joplin API Token">
            <p class="description" style="margin-top: 8px; padding: 10px; background: #f0f9ff; border-radius: 8px; border-left: 3px solid #3b82f6;">
                <strong>💡 如何获取 Token？</strong><br>
                1. 打开 Joplin Desktop 应用<br>
                2. 点击"工具" → "选项"（Mac: "Joplin" → "Preferences"）<br>
                3. 选择"高级"标签页<br>
                4. 复制"网页服务 API 密钥"中的内容<br>
                <em style="color: #f59e0b;">⚠️ 注意：Chrome 扩展无法读取系统环境变量，请手动复制 Token 到此处</em>
            </p>
        </div>

        <div class="setting-group">
            <label for="joplinUrl">🔗 Joplin Server URL（可选）</label>
            <p class="description">如果 Joplin 不在默认地址（127.0.0.1:41184），请在此修改。</p>
            <input type="text" id="joplinUrl" placeholder="http://127.0.0.1:41184">
        </div>

        <button class="btn btn-primary" id="saveBtn">保存设置</button>
        <button class="btn btn-secondary" id="clearBtn">清除 Token</button>

        <div class="status" id="status"></div>

        <p class="version">我的右键 v1.3.6 MV3</p>
    </div>

    <script src="options.js"></script>
</body>
</html>
